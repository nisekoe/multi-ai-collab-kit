[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-ai-collab-kit"
version = "0.2.0"
description = "让本机多个已经开着的异构 AI 窗口像同事一样互相派活、接棒、核验的机制层工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/nisekoe/multi-ai-collab-kit"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py39"